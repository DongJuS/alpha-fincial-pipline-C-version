services:
  postgres:
    image: postgres:15.14-alpine
    environment:
      POSTGRES_DB: alpha_test
      POSTGRES_USER: alpha_test
      POSTGRES_PASSWORD: alpha_test_only
    ports:
      - "127.0.0.1:${ALPHA_POSTGRES_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alpha_test -d alpha_test"]
      interval: 2s
      timeout: 3s
      retries: 30
    tmpfs:
      - /var/lib/postgresql/data
    shm_size: 128mb
    cpus: 1.0
    mem_limit: 512m

  redis:
    image: redis:7.4.11-alpine
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - 128mb
      - --maxmemory-policy
      - noeviction
    ports:
      - "127.0.0.1:${ALPHA_REDIS_PORT:-56379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
    tmpfs:
      - /data
    cpus: 0.5
    mem_limit: 256m
