name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  PYTHON_REFERENCE_SHA: 3642cdc0e4026424ca9b6158125551eee1d42683
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  python-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11.15"
      - name: Check out pinned Python reference
        run: |
          git clone --no-checkout https://github.com/DongJuS/alpha-financial-pipeline.git ../alpha-financial-pipeline
          git -C ../alpha-financial-pipeline checkout --detach "$PYTHON_REFERENCE_SHA"
      - name: Verify fixtures, source hashes, and Python golden
        run: python -m unittest discover -s tests -v

  c-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        preset: [dev, bench]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11.15"
      - name: Configure
        run: cmake --preset "${{ matrix.preset }}"
      - name: Build
        run: cmake --build --preset "${{ matrix.preset }}" --parallel
      - name: Test exact artifact
        run: ctest --preset "${{ matrix.preset }}"
      - name: Verify compiler flags
        run: |
          if [ "${{ matrix.preset }}" = dev ]; then
            python tools/verify_build_flags.py dev build/compile_commands.json
          else
            python tools/verify_build_flags.py bench build/bench/compile_commands.json
          fi

  c-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install LLVM quality tools
        run: sudo apt-get update && sudo apt-get install -y clang-format clang-tidy
      - name: Configure compile database
        run: cmake --preset dev
      - name: Check formatting
        run: >-
          clang-format --dry-run --Werror
          $(find core -name '*.c' -o -name '*.h')
          spike/event_loop/main.c
      - name: Run clang-tidy
        run: >-
          clang-tidy -p build
          core/src/alpha.c
          core/src/domain/date.c core/src/domain/round.c
          core/src/backtest/cost_model.c core/src/backtest/signal_source.c
          core/src/backtest/metrics.c core/src/backtest/engine.c
          core/src/market_data/market_data.c core/src/portfolio/blending.c
          core/src/portfolio/sizing.c core/src/risk/gates.c
          core/src/indicators/screener.c
          core/apps/backtest_fixture.c core/apps/backtest_runner.c
          core/apps/blend_runner.c core/apps/risk_runner.c core/apps/risk_runner.c
          --warnings-as-errors=*
          --header-filter='core/(include|src|apps)/.*'
      - name: Configure and lint event-loop spike
        run: |
          sudo apt-get update
          sudo apt-get install -y libpq-dev libhiredis-dev libcurl4-openssl-dev pkg-config
          tools/build_pinned_libwebsockets.sh
          cmake -S spike/event_loop -B build/event-loop \
            -DALPHA_LWS_PREFIX="$PWD/build/deps/libwebsockets/install" \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          clang-tidy -p build/event-loop spike/event_loop/main.c \
            --checks='-*,clang-analyzer-*,bugprone-*,performance-*,portability-*,-bugprone-easily-swappable-parameters,-bugprone-signed-bitwise,-performance-no-int-to-ptr' \
            --warnings-as-errors=*

  rust-boundary:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: edge
    steps:
      - uses: actions/checkout@v6
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Verify locked workspace metadata
        run: cargo metadata --locked --format-version 1 --no-deps
      - name: Build selected datalake boundary
        run: cargo build --workspace --all-features --locked
      - name: Test default and selected feature boundaries
        run: |
          cargo test --workspace --locked
          cargo test --workspace --all-features --locked
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  shared-services:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11.15"
      - name: Check out pinned Python reference
        run: |
          git clone --no-checkout https://github.com/DongJuS/alpha-financial-pipeline.git ../alpha-financial-pipeline
          git -C ../alpha-financial-pipeline checkout --detach "$PYTHON_REFERENCE_SHA"
      - name: Validate Compose model
        run: docker compose config --quiet
      - name: Start pinned shared services
        run: docker compose up -d --wait
      - name: Verify PostgreSQL and Redis readiness
        run: python tools/verify_services.py
      - name: Install single-loop spike dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libpq-dev postgresql-client libhiredis-dev
          libcurl4-openssl-dev pkg-config
      - name: Build and verify pinned single-loop dependency
        run: tools/build_pinned_libwebsockets.sh
      - name: Apply pinned Python schema twice
        env:
          ALPHA_RUN_SCHEMA_APPLY: "1"
        run: python -m unittest tests.test_schema_apply -v
      - name: Build and verify single-loop failure/recovery evidence
        env:
          ALPHA_RUN_EVENT_LOOP_SPIKE: "1"
        run: python -m unittest tests.test_event_loop_spike -v
      - name: Stop shared services
        if: always()
        run: docker compose down --volumes
